<span class="face">
  <span class="chip">{{ face().childName }}</span>
  <span class="art">
    <img class="art-image" [ngSrc]="face().art" alt="" fill />
  </span>
  <span class="name">{{ face().themeName }}</span>
  <span class="flag" aria-hidden="true"></span>
  @if (face().badge !== 'none') {
    <span class="badge" aria-hidden="true"></span>
  }
</span>
