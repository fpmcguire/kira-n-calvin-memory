<div #table class="table">
  <div class="grid" [style.grid-template-columns]="columns()" [style.gap.px]="layout().gap">
    @for (card of cards(); track card.id; let index = $index) {
      @let shown = card.state === 'up' || card.state === 'peeked';
      <button
        type="button"
        class="card"
        [disabled]="card.state === 'gone'"
        [attr.aria-label]="card.label"
        [attr.data-testid]="'board-card-button-' + index"
        [attr.data-state]="card.state"
        [attr.data-card-id]="card.id"
        [attr.data-theme]="card.face.themeId"
        [attr.data-variant]="card.face.variant"
        [attr.data-difference]="card.face.difference"
        (click)="selected.emit(index)"
      >
        <span class="flipper">
          <span class="back" aria-hidden="true">
            <app-card-back />
          </span>
          <!-- A down or gone face stays out of the accessibility tree and rendered text (AC1). -->
          <span class="front" [attr.aria-hidden]="shown ? null : 'true'">
            <app-card-face [face]="card.face" />
          </span>
        </span>
      </button>
    }
  </div>
</div>
