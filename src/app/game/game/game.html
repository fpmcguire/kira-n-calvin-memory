<div class="shell" [attr.inert]="overlayOpen() ? '' : null">
  <header
    app-game-header
    [players]="state.players()"
    [timerText]="state.timerText()"
    [timerState]="state.timerState()"
    [showAllDisabled]="state.showAllDisabled()"
    [restartDisabled]="state.restartDisabled()"
    [newGameDisabled]="state.newGameDisabled()"
    [soundOn]="state.soundOn()"
    (showAll)="state.showAll()"
    (restart)="state.restart()"
    (newGame)="state.openOptions()"
    (soundToggle)="state.toggleSound()"
  ></header>
  <main>
    @if (state.play()) {
      <app-board
        [cards]="state.cardViews()"
        [deal]="state.dealSerial()"
        (selected)="state.selectCard($event)"
      />
    } @else {
      <app-preview-board [count]="state.previewCount()" />
    }
  </main>
</div>

@if (state.splashVisible()) {
  <app-splash
    [variant]="state.birthdaySplash ? 'birthday' : 'generic'"
    (dismissed)="state.dismissSplash()"
  />
}

@if (state.result(); as result) {
  <app-end-screen
    [hidden]="state.popupOpen()"
    [attr.inert]="state.popupOpen() ? '' : null"
    [result]="result"
    [time]="state.timerText()"
    [best]="state.best()"
    (restart)="state.restart()"
    (newGame)="state.openOptions()"
  />
}

@if (state.reveal(); as reveal) {
  <app-pair-reveal
    [faces]="reveal.faces"
    [outcome]="reveal.outcome"
    (dismissed)="state.dismissReveal()"
  />
}

@if (state.popupOpen()) {
  <app-options-popup
    [attr.inert]="state.confirm() ? '' : null"
    [(draft)]="state.draft"
    [closable]="state.closable()"
    (closed)="state.closeOptions()"
    (go)="state.go()"
  />
}

@if (state.confirm()) {
  <app-confirm-dialog
    [cancelLabel]="cancelLabel()"
    (cancelled)="state.cancelStartOver()"
    (confirmed)="state.confirmStartOver()"
  />
}
